name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Evomusic.Core.Tests

  ios:
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The iOS workload (SDK pack 27.1) needs a matching Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet workload install maui-ios --version 10.0.403

      # Unsigned build: Impactor signs it on Windows with the free Apple ID.
      - run: >
          dotnet publish src/Evomusic.App/Evomusic.App.csproj
          -f net10.0-ios -c Release -r ios-arm64
          -p:EnableCodeSigning=false
          -p:BuildIpa=false
          -o out

      - name: Package unsigned IPA
        run: |
          APP=$(find src/Evomusic.App/bin/Release/net10.0-ios/ios-arm64 -maxdepth 2 -name "*.app" -type d | head -n 1)
          test -n "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Evomusic.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Evomusic-ipa
          path: Evomusic.ipa
          retention-days: 14
